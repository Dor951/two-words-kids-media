name: instagram-post
on:
  schedule:
    - cron: "10 17 * * *"
    - cron: "40 19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = show next due post, probe = check the token, false = post"
        default: "true"
permissions:
  contents: write
concurrency:
  group: instagram-post
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Post next due
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then python3 scripts/ig_post.py --dry-run; elif [ "${{ github.event.inputs.dry_run }}" = "probe" ]; then python3 scripts/ig_post.py --probe; else python3 scripts/ig_post.py; fi
      - name: Save log
        run: |
          git config user.name twk-bot && git config user.email bot@users.noreply.github.com
          git add instagram/posted.json
          if ! git diff --cached --quiet; then git commit -m "log instagram post" && git pull --rebase origin main && git push origin HEAD:main; fi
